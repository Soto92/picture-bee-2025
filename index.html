<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Rafinha Flashcards</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- CENARIO DE CONTO INFANTIL -->
    <div class="scenery">
      <div class="sun"></div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="hill hill-1"></div>
      <div class="hill hill-2"></div>
      <div class="hill hill-3"></div>
      <div class="tree tree-1"><div class="trunk"></div><div class="leaves"></div></div>
      <div class="tree tree-2"><div class="trunk"></div><div class="leaves"></div></div>
      <div class="bird bird-1"></div>
      <div class="bird bird-2"></div>
      <div class="butterfly butterfly-1"></div>
      <div class="butterfly butterfly-2"></div>
    </div>

    <!-- MENU -->
    <div id="menu">
      <h1>Rafinha Flash Cards</h1>
      <button class="day-btn" data-day="1">Day 1</button>
      <button class="day-btn" data-day="2">Day 2</button>
      <button class="day-btn" data-day="3">Day 3</button>
    </div>

    <!-- GAME -->
    <div id="game" class="hidden">
      <div class="card" id="flashcard">
        <div class="card-inner">
          <div class="card-front">
            <img src="" alt="" id="card-image" />
          </div>
          <div class="card-back" id="card-word"></div>
        </div>
      </div>

      <button id="nextBtn">Next</button>
      <button id="homeBtn">Home</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
